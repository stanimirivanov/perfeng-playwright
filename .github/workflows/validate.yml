name: Validate browser runner

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Report toolchain
        run: make doctor
      - name: Run Linux verification
        run: make verify
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-evidence-linux
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - name: Install GNU Make
        shell: pwsh
        run: choco install make --version=4.4.1 --no-progress --yes
      - name: Report toolchain
        run: make doctor
      - name: Run Windows verification
        run: make verify
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-evidence-windows
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Audit complete dependency graph
        run: make supply-chain
